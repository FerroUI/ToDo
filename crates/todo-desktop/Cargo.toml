[package]
name = "todo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "todo-desktop"
path = "src/main.rs"
test = false

[dependencies]
todo-domain.workspace = true
todo-state.workspace = true
todo-controls.workspace = true
todo-ui.workspace = true
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-desktop.workspace = true
ferroui-fonts-inter.workspace = true
chrono = { workspace = true, features = ["clock"] }
url.workspace = true
serde.workspace = true
serde_json.workspace = true
todo-interop.workspace = true
todo-credentials.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Media_Audio"] }
