name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_BROWSER_CODEGEN_UNITS: 16
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/browser-toolchain
        id: toolchain
      - name: Check task state and synchronization
        run: |
          cargo test --locked -p todo-domain -p todo-state -p todo-interop -p todo-credentials
          cargo test --locked -p todo-ui --lib
          node --test scripts/*.test.mjs
      - name: Build browser app
        id: browser_build
        env:
          TODO_MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          TODO_MICROSOFT_TENANT: ${{ vars.MICROSOFT_TENANT }}
          TODO_MICROSOFT_REDIRECT_URI: ${{ vars.MICROSOFT_REDIRECT_URI }}
          TODO_MICROSOFT_CLOUD: ${{ vars.MICROSOFT_CLOUD }}
        run: bash scripts/build-browser.sh
      - name: Cache browser compilation
        if: ${{ github.ref == 'refs/heads/main' && steps.toolchain.outputs.build-cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.toolchain.outputs.build-cache-paths }}
          key: ${{ steps.toolchain.outputs.build-cache-key }}
      - name: Check browser editing and rendering
        run: timeout --signal=TERM --kill-after=10s 14m node scripts/ui-smoke.mjs target/browser/todo-browser target/browser/todo-browser/qa
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ !cancelled() && steps.browser_build.outcome == 'success' }}
        with:
          path: target/browser/todo-browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify published app
        env:
          TODO_DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          TODO_PUBLIC_URL="${TODO_DEPLOYED_URL/#http:/https:}"
          for TODO_ASSET in "" "main.js" "todo_browser.wasm" "qa/my-day-narrow.png"; do
            curl --fail --silent --show-error --location --head \
              --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 60 --max-time 15 \
              --output /dev/null --write-out '%{url_effective} %{http_code} %{content_type}\n' \
              "${TODO_PUBLIC_URL}${TODO_ASSET}"
          done
